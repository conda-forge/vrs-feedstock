{% set name = "vrs" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # - url: https://github.com/facebookresearch/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  #   sha256: cd0f2a043a8ee2386c4bec61987e9c25f8de748f4d63bbe34a0d15115d858a98
  git_url: https://github.com/facebookresearch/vrs.git
  git_rev: 89d9ec5f1867cb139d06eb7d297ef1206ad35478
  patches:
    - patches/0001-use-conda-deps-in-cmake-config.patch

build:
  number: 11
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja  # [not win]
  host:
    - libboost-devel
    - rapidjson
    - fmt
    - libjpeg-turbo
    - portaudio
    - xxhash
    - zlib
    - qt
    - qt-main
    - mesalib  # [linux]
    - libpng
    - lz4-c
    - zstd
    # Newly introduced dependencies for v1.4.0
    - eigen # required by ocean
    - libopus # required for OPUS audio codec
    - ffmpeg {{ ffmpeg }} lgpl_* # required for Aria Gen2 Image streams support
  run:
    # The installed vrslib CMake config resolves these dependency targets for consumers.
    - libboost-devel
    - rapidjson
    - fmt
    - libjpeg-turbo
    - xxhash
    - zlib
    - libpng
    - lz4-c
    - zstd
    - eigen
    - libopus
    - ffmpeg {{ ffmpeg }}


test:
  commands:
    - bash run_test.sh  # [unix]
    - call run_test.bat  # [win]
  requires:
    - {{ compiler('cxx') }}
    - cmake
    - ninja
  files:
    - run_test.sh
    - run_test.bat
    - tests/

about:
  home: https://github.com/facebookresearch/vrs
  summary: 'A library and binaries for manipulating VRS files'
  description: |
    VRS is a file format optimized to record & playback streams of sensor data, such as images, audio samples, and any other discrete sensors (IMU, temperature, etc), stored in per-device streams of timestamped records.
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/facebookresearch/vrs

extra:
  recipe-maintainers:
    - jeongseok-meta
    - SeaOtocinclus
